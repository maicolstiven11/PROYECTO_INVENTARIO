<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administrador</title>
    <link rel="stylesheet" href="../css/panel_administrador.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <img class="navbar__logo" src="../assets/img/LOGO.png" alt="logo_sistema">
        </nav>
    </header>

    <main class="main-panel">
        <!-- Tarjeta principal del administrador -->
        <section class="admin-card">
            <!-- Encabezado con icono y título -->
            <div class="admin-card__header">
                <i class="fa-solid fa-user-shield admin-card__icono-grande"></i>
                <h1 class="admin-card__titulo">Panel de Administrador</h1>
            </div>

            <!-- Información del administrador -->
            <div class="admin-card__info">
                <div class="admin-card__avatar">
                    <i class="fa-solid fa-circle-user"></i>
                </div>

                <div class="admin-card__datos">
                    <div class="admin-card__dato">
                        <i class="fa-solid fa-user"></i>
                        <div class="admin-card__campo">
                            <span class="admin-card__label">Nombre</span>
                            <span class="admin-card__valor">Juan Administrador</span>
                        </div>
                    </div>

                    <div class="admin-card__dato">
                        <i class="fa-solid fa-envelope"></i>
                        <div class="admin-card__campo">
                            <span class="admin-card__label">Correo</span>
                            <span class="admin-card__valor">admin@sistema.com</span>
                        </div>
                    </div>

                    <div class="admin-card__dato">
                        <i class="fa-solid fa-id-badge"></i>
                        <div class="admin-card__campo">
                            <span class="admin-card__label">Rol</span>
                            <span class="admin-card__valor admin-card__valor--badge">Administrador</span>
                        </div>
                    </div>

                    <div class="admin-card__dato">
                        <i class="fa-solid fa-calendar"></i>
                        <div class="admin-card__campo">
                            <span class="admin-card__label">Miembro desde</span>
                            <span class="admin-card__valor">Enero 2024</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Opciones de gestión -->
            <div class="admin-card__opciones">
                <h2 class="admin-card__subtitulo">Opciones de Gestión</h2>

                <div class="admin-card__enlaces">
                    <a href="gestion_trabajadores.html" class="admin-card__enlace">
                        <i class="fa-solid fa-users"></i>
                        <span>Gestionar Trabajadores</span>
                    </a>

                    <a href="Lista_bares.html" class="admin-card__enlace">
                        <i class="fa-solid fa-store"></i>
                        <span>Gestionar Bares</span>
                    </a>

                    <a href="lista_proveedores.html" class="admin-card__enlace">
                        <i class="fa-solid fa-truck-field"></i>
                        <span>Proveedores</span>
                    </a>

                    <a href="perfil_admin.html" class="admin-card__enlace">
                        <i class="fa-solid fa-gear"></i>
                        <span>Configuración</span>
                    </a>
                </div>
            </div>

            <!-- Botones de acción -->
            <div class="admin-card__acciones">
                <a href="menu_inventario.html" class="admin-card__btn admin-card__btn--regresar">
                    <i class="fa-solid fa-arrow-left"></i>
                    Regresar al Menú
                </a>

                <a href="Inicio_sesion.html" class="admin-card__btn admin-card__btn--cerrar">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Cerrar Sesión
                </a>
            </div>
        </section>
    </main>

    <footer>
    </footer>
</body>

</html>
