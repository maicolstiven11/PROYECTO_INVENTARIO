<!--=====================================================================
    VISTA HTML: Produc_registrado.html - Página de Confirmación de Producto Registrado
    
    QUIÉN LA MUESTRA: ProductoServlet (POST exitoso) → 
    response.sendRedirect("view/Produc_registrado.html")
    
    PROPÓSITO:
    - Confirmar que el producto ha sido registrado exitosamente en el catálogo
    - Proporcionar opciones para continuar registrando productos o finalizar
    - Ofrecer retroalimentación visual positiva al usuario
    
    ACCIONES QUE PERMITE:
    - Agregar otro producto: Navega a → Registro_produc.html
    - Finalizar registro: Navega a → ProductoServlet (lista de productos)
    
    IMPORTANCIA:
    - Proporciona cierre al proceso de registro de productos
    - Mejora la experiencia de usuario con confirmación visual
    - Facilita el flujo continuo de gestión del catálogo
    =====================================================================-->
<!DOCTYPE html>
<!-- Inicio del documento HTML con idioma español -->
<html lang="es">

<!-- Cabecera del documento con metadatos y recursos -->
<head>
    <!-- Codificación de caracteres UTF-8 para soporte de caracteres especiales -->
    <meta charset="UTF-8">
    <!-- Configuración de viewport para diseño responsive en dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título de la página que aparece en el navegador -->
    <title>Producto registrado</title>
    <!-- Hoja de estilos CSS para la página de confirmación -->
    <link rel="stylesheet" href="../css/Produc_registrado.css">
    <!-- Librería Font Awesome: Iconos (fa-plus, fa-circle-check) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<!-- Cuerpo principal del documento -->
<body>
    <!-- Cabecera con navegación y logo del sistema -->
    <header>
        <!-- Barra de navegación principal -->
        <nav class="navbar">
            <!-- Logo del sistema que aparece en la barra de navegación -->
            <img class="navbar__logo" src="../assets/img/LOGO.png" alt="logo_sistema">
        </nav>
    </header>
    <!-- Contenido principal de la página -->
    <main>
        <!-- Título del sistema -->
        <h1 class="main__titulo">Contabilidad-Sistematica</h1>

        <!-- Sección principal con el mensaje de confirmación -->
        <section class="main__section__prd_regist">
            <div>
                <!-- Mensaje de éxito dividido en dos líneas -->
                <h2>PRODUCTO REGISTRADO <br> CON EXITO</h2>
                <!-- Icono visual de confirmación -->
                <img src="../assets/img/icono_correcto.png" alt="img_correcto">
            </div>
        </section>
        <!-- Sección con las opciones de acción -->
        <section class="main__section__rutas">
            <!-- Opción para agregar otro producto -->
            <a href="Registro_produc.html" class="section__agg">
                <!-- Icono de más para agregar -->
                <i class="fa-solid fa-plus"></i>
                <!-- Texto descriptivo de la acción -->
                <h3>Agregar otro producto</h3>
            </a>

            <!-- Opción para finalizar el registro de productos -->
            <a href="../ProductoServlet" class="section__fin_regis">
                <!-- Icono de check para finalizar -->
                <i class="fa-solid fa-circle-check"></i>
                <!-- Texto descriptivo de la acción -->
                <h3>Finalizar el registro <br> de productos</h3>
            </a>
        </section>
    </main>
    <!-- Pie de página (vacío en este caso) -->
    <footer></footer>
</body>

<!-- Cierre del documento HTML -->
</html>
