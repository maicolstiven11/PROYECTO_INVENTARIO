<!--
=====================================================================
    VISTA HTML: Registro_datos_prv.html - Formulario de Registro de Proveedores
    
    QUIÉN LA MUESTRA: Se accede desde lista_proveedores.jsp → 
    <a href="../view/Registro_datos_prv.html">Agregar Proveedor</a>
    
    DATOS QUE ENVÍA AL CONTROLADOR:
    - POST → ProveedorServlet?action=agregar
    Envía: nombre_proveedor, contacto, telefono, correo
    
    DATOS QUE RECIBE DE URL:
    - ?error=proveedor_duplicado → Muestra error de duplicidad
    
    IMPORTANCIA:
    - Permite registrar nuevos proveedores para el negocio
    - Fundamental para el proceso de compras y pedidos
    - Facilita la gestión de la cadena de suministro
    ======================================================================-->
<!DOCTYPE html>
<html lang="es">

<!-- Cabecera del documento con metadatos y recursos -->
<head>
    <!-- Codificación de caracteres UTF-8 para soporte de caracteres especiales -->
    <meta charset="UTF-8">
    <!-- Configuración de viewport para diseño responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título de la página que aparece en el navegador -->
    <title>Registro de los datos de proveedores</title>
    <!-- Reutilizamos estilos del formulario de gastos -->
    <link rel="stylesheet" href="../css/Registro_gastos.css">
</head>

<!-- Cuerpo principal del documento -->
<body>
    <!-- Cabecera con navegación y logo del sistema -->
    <header>
        <nav class="navbar">
            <!-- Logo del sistema que aparece en la barra de navegación -->
            <img class="navbar__logo" src="../assets/img/LOGO.png" alt="logo_sistema">
        </nav>
    </header>
    <!-- Contenido principal de la página -->
    <main>
        <!-- Título principal del sistema -->
        <h1 class="main__titulo">Contabilidad-Sistematica</h1>
        <!-- Subtítulos descriptivos -->
        <h2 class="main__subtitulo">Registre los datos </h2>
        <h2 class="main__subtitulo">de proveedores </h2>

        <!-- Contenedor para mensajes de error intuitivos -->
        <div id="mensajeError"
            style="display: none; background-color: #f8d7da; color: #721c24; padding: 12px; border-radius: 5px; text-align: center; margin: 15px auto; width: 80%; border: 1px solid #f5c6cb; font-family: sans-serif; font-size: 14px;">
            <!-- Icono de advertencia y mensaje de error -->
            <i class="fa-solid fa-triangle-exclamation"></i> <strong id="errorTexto">Error al registrar
                proveedor.</strong>
        </div>

        <!-- Script para manejar mensajes de error desde URL -->
        <script>
            // Se ejecuta cuando el DOM está completamente cargado
            document.addEventListener("DOMContentLoaded", function () {
                // Obtiene los parámetros de la URL
                const urlParams = new URLSearchParams(window.location.search);
                // Verifica si hay un parámetro de error
                if (urlParams.has('error')) {
                    // Obtiene el tipo de error
                    const error = urlParams.get('error');
                    // Obtiene los elementos del DOM
                    const divError = document.getElementById('mensajeError');
                    const spanTexto = document.getElementById('errorTexto');
                    // Muestra el contenedor de error
                    divError.style.display = 'block';
                    // Muestra el mensaje específico según el tipo de error
                    if (error === 'proveedor_duplicado') {
                        spanTexto.textContent = 'El nombre o el correo del proveedor ya están registrados.';
                    }
                    // Limpia la URL para que no se muestre el error al recargar
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            });
        </script>

        <!-- Sección principal del formulario -->
        <section class="main__contenedorForm">
            <!-- Formulario para registrar nuevo proveedor -->
            <form class="main__formulario" action="../ProveedorServlet" method="POST">
                <!-- Campo para el nombre del proveedor -->
                <div class="campo">
                    <!-- Etiqueta para el campo de nombre -->
                    <label for="name" class="formulario__nombre"></label>
                    <!-- Campo de entrada para el nombre del proveedor -->
                    <input id="name" class="form__input_name" type="text" name="nombre_proveedor" required
                        placeholder="Nombre del proveedor" maxlength="100">
                </div>
                <!-- Campo para el contacto del proveedor -->
                <div class="campo">
                    <!-- Etiqueta para el campo de contacto -->
                    <label for="contacto"></label>
                    <!-- Campo de entrada para el nombre del contacto -->
                    <input type="text" id="contacto" name="contacto" placeholder="contacto" required maxlength="100">
                </div>

                <!-- Campo para el teléfono del proveedor -->
                <div class="campo">
                    <!-- Etiqueta para el campo de teléfono -->
                    <label for="telefono"></label>
                    <!-- Campo de entrada para el teléfono (solo números) -->
                    <input type="tel" id="telefono" name="telefono" placeholder="telefono" required minlength="7"
                        maxlength="20" pattern="[0-9]+" title="Solo se permiten números"
                        oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>
                <!-- Campo para el correo del proveedor -->
                <div class="campo">
                    <!-- Etiqueta para el campo de correo -->
                    <label for="correo"></label>
                    <!-- Campo de entrada para el correo electrónico -->
                    <input type="email" id="correo" name="correo" placeholder="correo" required maxlength="150">
                </div>
                <!-- Botón para enviar el formulario -->
                <button class="contenedor__btnfinalizar">Finalizar</button>
            </form>
        </section>
    </main>
    <!-- Pie de página -->
    <footer>

        <!-- Librería Font Awesome: Iconos (fa-triangle-exclamation) -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <!-- Script de validaciones externo -->
        <script src="../js/validaciones.js"></script>
</body>

<!-- Cierre del documento HTML -->
</html>
