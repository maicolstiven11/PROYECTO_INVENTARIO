<!--=====================================================================
    VISTA HTML: pedido_finalizado.html - Página de Confirmación de Pedido Registrado
    
    QUIÉN LA MUESTRA: PedidoServlet (POST exitoso) → 
    response.sendRedirect("view/pedido_finalizado.html")
    
    PROPÓSITO:
    - Confirmar que el pedido a proveedor ha sido registrado exitosamente
    - Proporcionar opciones para continuar trabajando
    - Ofrecer retroalimentación visual positiva al usuario
    
    ACCIONES QUE PERMITE:
    - Volver al menú: Navega a → menu_inventario.jsp
    - Agregar otro pedido: Navega a → PedidoServlet?action=nuevo
    
    IMPORTANCIA:
    - Proporciona cierre al proceso de registro de pedidos
    - Mejora la experiencia de usuario con confirmación visual
    - Facilita el flujo continuo de gestión de compras
    =====================================================================-->
<!DOCTYPE html>
<!-- Inicio del documento HTML con idioma español -->
<html lang="es">

<!-- Cabecera del documento con metadatos y recursos -->
<head>
    <!-- Codificación de caracteres UTF-8 para soporte de caracteres especiales -->
    <meta charset="UTF-8">
    <!-- Configuración de viewport para diseño responsive en dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título de la página que aparece en el navegador -->
    <title>Pedido Finalizado</title>
    <!-- Hoja de estilos CSS para la página de confirmación -->
    <link rel="stylesheet" href="../css/pedido_finalizado.css">
    <!-- Librería Font Awesome: Iconos (fa-arrow-left, fa-plus) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<!-- Cuerpo principal del documento -->
<body>
    <!-- Cabecera con navegación y logo del sistema -->
    <header>
        <!-- Barra de navegación principal -->
        <nav class="navbar">
            <!-- Logo del sistema que aparece en la barra de navegación -->
            <img class="navbar__logo" src="../assets/img/LOGO.png" alt="logo_sistema">
        </nav>
    </header>
    <!-- Contenido principal de la página -->
    <main>
        <!-- Título del sistema -->
        <h1 class="main__titulo">Sistema de Inventario</h1>
        <!-- Sección con fondo difuminado para el mensaje de confirmación -->
        <section class="fondo-blur">
            <!-- Contenedor principal del mensaje de confirmación -->
            <div class="registro_confirmacion">
                <!-- Mensaje principal de éxito -->
                <h2>PEDIDO REGISTRADO CON ÉXITO</h2>
                <!-- Icono visual de confirmación -->
                <img src="../assets/img/icono_correcto.png" alt="icono_correcto">

                <!-- Botones de acción para continuar -->
                <div class="botones-accion">
                    <!-- Botón para volver al menú principal de inventario -->
                    <a href="../view/menu_inventario.jsp" class="btn-accion btn-volver">
                        <i class="fa-solid fa-arrow-left"></i> Volver al Menú
                    </a>
                    <!-- Botón para registrar un nuevo pedido -->
                    <a href="../PedidoServlet?action=nuevo" class="btn-accion btn-agregar">
                        <i class="fa-solid fa-plus"></i> Agregar otro pedido
                    </a>
                </div>
            </div>
        </section>
    </main>
    <!-- Pie de página (vacío en este caso) -->
    <footer>
    </footer>
</body>

<!-- Cierre del documento HTML -->
</html>
