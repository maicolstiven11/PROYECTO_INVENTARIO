<!--=====================================================================
    VISTA HTML: Inicio_sesion.html - Formulario de Autenticación
    
    QUIÉN LA MUESTRA: index.html → Al hacer clic en "Contabilidad-Sistematica"
    o puede ser accedida directamente
    
    PROPÓSITO:
    - Proporcionar formulario de inicio de sesión
    - Autenticar usuarios en el sistema
    - Dar acceso a opciones de registro
    
    ACCIONES QUE ENVÍA:
    - Iniciar sesión: POST → LoginServlet (autenticación)
    - Registrarse: Navega a → view/registroUser.html
    
    MANEJO DE ERRORES:
    - Detecta parámetro ?error=1 en la URL
    - Muestra mensaje de "Credenciales incorrectas"
    - Limpia la URL después de mostrar el error
    
    IMPORTANCIA:
    - Es el punto de acceso seguro al sistema
    - Valida credenciales de usuarios
    - Gateway hacia el registro de nuevos usuarios
    =====================================================================-->
<!DOCTYPE html>
<!-- Inicio del documento HTML con idioma inglés (configuración por defecto) -->
<html lang="en">

<!-- Cabecera del documento con metadatos y recursos -->
<head>
    <!-- Codificación de caracteres UTF-8 para soporte de caracteres especiales -->
    <meta charset="UTF-8">
    <!-- Configuración de viewport para diseño responsive en dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título de la página que aparece en el navegador -->
    <title>Inicio de sesion</title>
    <!-- Hoja de estilos CSS para el formulario de inicio de sesión -->
    <link rel="stylesheet" href="../css/Inicio_sesion.css">
    <!-- Librería Font Awesome: Iconos (fa-envelope, fa-lock, fa-triangle-exclamation) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<!-- Cuerpo principal del documento -->
<body>
    <!-- Cabecera con navegación y logo del sistema -->
    <header>
        <!-- Barra de navegación principal -->
        <nav class="navbar">
            <!-- Logo del sistema que aparece en la barra de navegación -->
            <img class="navbar__logo" src="../assets/img/LOGO.png" alt="logo_sistema">
        </nav>

    </header>
    <!-- Contenido principal de la página -->
    <main>
        <!-- Título principal de la página -->
        <h1 class="main__titulo">Inicio sesion</h1>
        <!-- Subtítulo con el nombre del sistema -->
        <h2 class="main__subtitulo">Contabilidad-Sistematica</h2>
        <!-- Sección con opciones para iniciar sesión o registrarse -->
        <section class="seccion__inicioResgistrar">
            <!-- Enlace para mostrar formulario de inicio de sesión (actualmente solo muestra el formulario que ya está visible) -->
            <a href="#" class="inicio_sesion">Iniciar sesion</a>
            <!-- Enlace para navegar a la página de registro de usuarios -->
            <a href="/view/registroUser.html" class="registrarse">Registrarse</a>
        </section>

        <!-- Contenedor para el mensaje de error (inicialmente oculto) -->
        <div id="mensajeError"
            style="display: none; background-color: #f8d7da; color: #721c24; padding: 12px; border-radius: 5px; text-align: center; margin: 15px auto; width: 80%; border: 1px solid #f5c6cb; font-family: sans-serif; font-size: 14px;">
            <!-- Icono de advertencia y mensaje de error -->
            <i class="fa-solid fa-triangle-exclamation"></i> <strong>Credenciales incorrectas.</strong> El correo o la
            contraseña no son válidos.
        </div>

        <!-- Formulario de inicio de sesión que envía datos al LoginServlet -->
        <form class="main__formulario" action="../LoginServlet" method="POST">
            <!-- Campo para el correo electrónico -->
            <div class="campo">
                <!-- Etiqueta para el campo de email (no visible pero accesible) -->
                <label for="email" class="formulario__email__icon"></label>
                <!-- Icono de sobre para el campo de email -->
                <i class="fas fa-envelope icono"></i>
                <!-- Campo de entrada para el correo electrónico -->
                <input class="form__input_email" type="email" name="email" required placeholder="Email" maxlength="150">
            </div>

            <!-- Campo para la contraseña -->
            <div class="campo">
                <!-- Etiqueta para el campo de contraseña (no visible pero accesible) -->
                <label for="password" class="formulario__password__icon"></label>
                <!-- Icono de candado para el campo de contraseña -->
                <i class="fas fa-lock icono"></i>
                <!-- Campo de entrada para la contraseña con validaciones -->
                <input class="form__input_email" type="password" name="password" required placeholder="Contraseña"
                    minlength="6" maxlength="50">
            </div>

            <!-- Contenedor para el botón de inicio de sesión -->
            <div class="contenedor__btnLogin">
                <!-- Botón que envía el formulario -->
                <button class="formulario__btnLogin">Inciar sesion</button>
            </div>

        </form>

        <!-- Sección con opciones adicionales del formulario -->
        <div class="form__opciones">
            <!-- Mensaje sobre recuperación de contraseña (no funcional, solo informativo) -->
            <span class="opcion__cambiarContra" style="cursor: default; font-size: 13px; color: #888;">¿Olvidaste tu
                contraseña? Contacta al administrador</span>
        </div>

    </main>
    <!-- Pie de página (vacío en este caso) -->
    <footer>

    </footer>

    <!-- Script para detectar parámetros de error en la URL -->
    <script>
        // Se ejecuta cuando el DOM está completamente cargado
        document.addEventListener("DOMContentLoaded", function () {
            // Obtiene los parámetros de la URL actual
            const urlParams = new URLSearchParams(window.location.search);
            // Verifica si existe el parámetro 'error' con valor '1'
            if (urlParams.has('error') && urlParams.get('error') === '1') {
                // Muestra el mensaje de error cambiando el display a block
                document.getElementById('mensajeError').style.display = 'block';
                // Limpia la URL para que si el usuario recarga la página no siga apareciendo el error
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
    </script>
    <!-- Script de validaciones centralizadas -->
    <script src="../js/validaciones.js"></script>
</body>

<!-- Cierre del documento HTML -->
</html>
