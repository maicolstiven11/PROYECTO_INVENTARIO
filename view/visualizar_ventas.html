<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Ventas</title>
    <link rel="stylesheet" href="/css/visualizar_ventas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <img class="navbar__logo" src="/assets/img/LOGO.png" alt="logo_sistema">
        </nav>
    </header>
    <main>
        <h2>VENTAS REGISTRADAS</h2>

        <div class="tabla-contenedor">
            <table class="tabla-ventas">
                <thead>
                    <tr>
                        <th>ID Venta</th>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Precio Unit.</th>
                        <th>Subtotal</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Datos de ejemplo -->
                    <tr>
                        <td>001</td>
                        <td>Cerveza Poker</td>
                        <td>5</td>
                        <td>$4,000</td>
                        <td>$20,000</td>
                        <td>2023-10-25</td>
                    </tr>
                    <tr>
                        <td>002</td>
                        <td>Gaseosa Coca Cola</td>
                        <td>2</td>
                        <td>$3,500</td>
                        <td>$7,000</td>
                        <td>2023-10-25</td>
                    </tr>
                    <tr>
                        <td>003</td>
                        <td>Agua Cristal</td>
                        <td>1</td>
                        <td>$2,000</td>
                        <td>$2,000</td>
                        <td>2023-10-26</td>
                    </tr>
                    <tr>
                        <td>004</td>
                        <td>Cerveza Aguila</td>
                        <td>10</td>
                        <td>$4,000</td>
                        <td>$40,000</td>
                        <td>2023-10-26</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="/view/menu_inventario.html" class="btn-regresar">
            <i class="fa-solid fa-arrow-left"></i> Regresar
        </a>
    </main>
    <footer>
    </footer>
</body>

</html>
