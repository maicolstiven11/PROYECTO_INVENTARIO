<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Ventas</title>
    <link rel="stylesheet" href="/css/visualizar_ventas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <img class="navbar__logo" src="/assets/img/LOGO.png" alt="logo_sistema">
        </nav>
    </header>
    <main>
        <h2>VENTAS REGISTRADAS</h2>

        <div class="table-container">
            <table class="data-table">
                <thead class="data-table__head">
                    <tr class="data-table__row data-table__row--head">
                        <th class="data-table__cell data-table__cell--head">ID Venta</th>
                        <th class="data-table__cell data-table__cell--head">Producto</th>
                        <th class="data-table__cell data-table__cell--head">Cantidad</th>
                        <th class="data-table__cell data-table__cell--head">Precio Unit.</th>
                        <th class="data-table__cell data-table__cell--head">Subtotal</th>
                        <th class="data-table__cell data-table__cell--head">Fecha</th>
                    </tr>
                </thead>
                <tbody class="data-table__body">
                    <!-- Datos de ejemplo -->
                    <tr class="data-table__row">
                        <td class="data-table__cell" data-label="ID Venta">001</td>
                        <td class="data-table__cell" data-label="Producto">Cerveza Poker</td>
                        <td class="data-table__cell" data-label="Cantidad">5</td>
                        <td class="data-table__cell" data-label="Precio Unit.">$4,000</td>
                        <td class="data-table__cell" data-label="Subtotal">$20,000</td>
                        <td class="data-table__cell" data-label="Fecha">2023-10-25</td>
                    </tr>
                    <tr class="data-table__row">
                        <td class="data-table__cell" data-label="ID Venta">002</td>
                        <td class="data-table__cell" data-label="Producto">Gaseosa Coca Cola</td>
                        <td class="data-table__cell" data-label="Cantidad">2</td>
                        <td class="data-table__cell" data-label="Precio Unit.">$3,500</td>
                        <td class="data-table__cell" data-label="Subtotal">$7,000</td>
                        <td class="data-table__cell" data-label="Fecha">2023-10-25</td>
                    </tr>
                    <tr class="data-table__row">
                        <td class="data-table__cell" data-label="ID Venta">003</td>
                        <td class="data-table__cell" data-label="Producto">Agua Cristal</td>
                        <td class="data-table__cell" data-label="Cantidad">1</td>
                        <td class="data-table__cell" data-label="Precio Unit.">$2,000</td>
                        <td class="data-table__cell" data-label="Subtotal">$2,000</td>
                        <td class="data-table__cell" data-label="Fecha">2023-10-26</td>
                    </tr>
                    <tr class="data-table__row">
                        <td class="data-table__cell" data-label="ID Venta">004</td>
                        <td class="data-table__cell" data-label="Producto">Cerveza Aguila</td>
                        <td class="data-table__cell" data-label="Cantidad">10</td>
                        <td class="data-table__cell" data-label="Precio Unit.">$4,000</td>
                        <td class="data-table__cell" data-label="Subtotal">$40,000</td>
                        <td class="data-table__cell" data-label="Fecha">2023-10-26</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="/view/menu_inventario.html" class="btn-regresar">
            <i class="fa-solid fa-arrow-left"></i> Regresar
        </a>
    </main>
    <footer>
    </footer>
</body>

</html>
