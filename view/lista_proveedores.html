<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Proveedores</title>
    <link rel="stylesheet" href="/css/lista_proveedores.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <img class="navbar__logo" src="/assets/img/LOGO.png" alt="logo_sistema">
        </nav>
    </header>
    <main>
        <h2>GESTIÓN DE PROVEEDORES</h2>

        <div class="table-container">
            <table class="data-table">
                <thead class="data-table__head">
                    <tr class="data-table__row data-table__row--head">
                        <th class="data-table__cell data-table__cell--head">ID</th>
                        <th class="data-table__cell data-table__cell--head">Nombre</th>
                        <th class="data-table__cell data-table__cell--head">Teléfono</th>
                        <th class="data-table__cell data-table__cell--head">Dirección</th>
                        <th class="data-table__cell data-table__cell--head">Productos</th>
                        <th class="data-table__cell data-table__cell--head">Acciones</th>
                    </tr>
                </thead>
                <tbody class="data-table__body">
                    <!-- Datos de ejemplo -->
                    <tr class="data-table__row">
                        <td class="data-table__cell" data-label="ID">001</td>
                        <td class="data-table__cell" data-label="Nombre">Bavaria S.A.</td>
                        <td class="data-table__cell" data-label="Teléfono">3001234567</td>
                        <td class="data-table__cell" data-label="Dirección">Calle 10 #25-30</td>
                        <td class="data-table__cell" data-label="Productos">Cervezas</td>
                        <td class="data-table__cell" data-label="Acciones">
                            <a href="#modal-editar" class="button button--edit">
                                <i class="fa-solid fa-pen-to-square"></i> Editar
                            </a>
                        </td>
                    </tr>
                    <tr class="data-table__row">
                        <td class="data-table__cell" data-label="ID">002</td>
                        <td class="data-table__cell" data-label="Nombre">Postobon</td>
                        <td class="data-table__cell" data-label="Teléfono">3109876543</td>
                        <td class="data-table__cell" data-label="Dirección">Av. Principal #50-10</td>
                        <td class="data-table__cell" data-label="Productos">Bebidas</td>
                        <td class="data-table__cell" data-label="Acciones">
                            <a href="#modal-editar" class="button button--edit">
                                <i class="fa-solid fa-pen-to-square"></i> Editar
                            </a>
                        </td>
                    </tr>
                    <tr class="data-table__row">
                        <td class="data-table__cell" data-label="ID">003</td>
                        <td class="data-table__cell" data-label="Nombre">Margarita</td>
                        <td class="data-table__cell" data-label="Teléfono">3205551234</td>
                        <td class="data-table__cell" data-label="Dirección">Carrera 8 #15-20</td>
                        <td class="data-table__cell" data-label="Productos">Snacks</td>
                        <td class="data-table__cell" data-label="Acciones">
                            <a href="#modal-editar" class="button button--edit">
                                <i class="fa-solid fa-pen-to-square"></i> Editar
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="/view/menu_inventario.html" class="btn-regresar">
            <i class="fa-solid fa-arrow-left"></i> Regresar
        </a>
    </main>

    <div id="modal-editar" class="modal">
        <div class="modal__content">
            <a href="#" class="modal__close">&times;</a>
            <h3 class="modal__title">Editar Proveedor</h3>
            <form class="modal__form">
                <div class="form-group">
                    <label class="form-group__label">Nombre del Proveedor</label>
                    <input class="form-group__input" type="text" value="Bavaria S.A.">
                </div>
                <div class="form-group">
                    <label class="form-group__label">Teléfono</label>
                    <input class="form-group__input" type="tel" value="3001234567">
                </div>
                <div class="form-group">
                    <label class="form-group__label">Dirección</label>
                    <input class="form-group__input" type="text" value="Calle 10 #25-30">
                </div>
                <div class="form-group">
                    <label class="form-group__label">Productos que suministra</label>
                    <input class="form-group__input" type="text" value="Cervezas">
                </div>
                <div class="modal__actions">
                    <a href="#" class="button button--cancel">Cancelar</a>
                    <a href="#" class="button button--accept">Aceptar</a>
                </div>
            </form>
        </div>
    </div>

    <footer>
    </footer>
</body>

</html>
