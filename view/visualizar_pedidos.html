<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Pedidos</title>
    <link rel="stylesheet" href="/css/visualizar_pedidos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <img class="navbar__logo" src="/assets/img/LOGO.png" alt="logo_sistema">
        </nav>
    </header>
    <main>
        <h2>PEDIDOS A PROVEEDORES</h2>

        <div class="table-container">
            <table class="data-table">
                <thead class="data-table__head">
                    <tr class="data-table__row data-table__row--head">
                        <th class="data-table__cell data-table__cell--head">ID Pedido</th>
                        <th class="data-table__cell data-table__cell--head">Proveedor</th>
                        <th class="data-table__cell data-table__cell--head">Fecha Pedido</th>
                        <th class="data-table__cell data-table__cell--head">Fecha Entrega</th>
                        <th class="data-table__cell data-table__cell--head">Subtotal</th>
                        <th class="data-table__cell data-table__cell--head">IVA</th>
                        <th class="data-table__cell data-table__cell--head">Total</th>
                    </tr>
                </thead>
                <tbody class="data-table__body">
                    <!-- Datos de ejemplo -->
                    <tr class="data-table__row">
                        <td class="data-table__cell" data-label="ID Pedido">001</td>
                        <td class="data-table__cell" data-label="Proveedor">Bavaria</td>
                        <td class="data-table__cell" data-label="Fecha Pedido">2023-10-20</td>
                        <td class="data-table__cell" data-label="Fecha Entrega">2023-10-22</td>
                        <td class="data-table__cell" data-label="Subtotal">$500,000</td>
                        <td class="data-table__cell" data-label="IVA">$95,000</td>
                        <td class="data-table__cell" data-label="Total">$595,000</td>
                    </tr>
                    <tr class="data-table__row">
                        <td class="data-table__cell" data-label="ID Pedido">002</td>
                        <td class="data-table__cell" data-label="Proveedor">Coca Cola</td>
                        <td class="data-table__cell" data-label="Fecha Pedido">2023-10-21</td>
                        <td class="data-table__cell" data-label="Fecha Entrega">2023-10-23</td>
                        <td class="data-table__cell" data-label="Subtotal">$300,000</td>
                        <td class="data-table__cell" data-label="IVA">$57,000</td>
                        <td class="data-table__cell" data-label="Total">$357,000</td>
                    </tr>
                    <tr class="data-table__row">
                        <td class="data-table__cell" data-label="ID Pedido">003</td>
                        <td class="data-table__cell" data-label="Proveedor">Postobon</td>
                        <td class="data-table__cell" data-label="Fecha Pedido">2023-10-24</td>
                        <td class="data-table__cell" data-label="Fecha Entrega">2023-10-26</td>
                        <td class="data-table__cell" data-label="Subtotal">$250,000</td>
                        <td class="data-table__cell" data-label="IVA">$47,500</td>
                        <td class="data-table__cell" data-label="Total">$297,500</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="/view/menu_inventario.html" class="btn-regresar">
            <i class="fa-solid fa-arrow-left"></i> Regresar
        </a>
    </main>
    <footer>
    </footer>
</body>

</html>
