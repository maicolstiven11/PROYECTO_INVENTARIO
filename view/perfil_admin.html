<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Administrador</title>
    <link rel="stylesheet" href="/css/perfil_admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <img class="navbar__logo" src="/assets/img/LOGO.png" alt="logo_sistema">
        </nav>
    </header>

    <main>
        <div class="contenedor-perfil">
            <div class="cabecera-perfil">
                <div class="avatar-perfil">
                    <i class="fa-solid fa-user-tie"></i>
                </div>
                <h2>Administrador Principal</h2>
                <span class="rol-perfil">Administrador</span>
            </div>

            <div class="info-perfil">
                <div class="item-info">
                    <span class="etiqueta-info">ID Usuario:</span>
                    <span class="valor-info">001</span>
                </div>
                <div class="item-info">
                    <span class="etiqueta-info">Correo Electrónico:</span>
                    <span class="valor-info">admin@sistema.com</span>
                </div>
                <div class="item-info">
                    <span class="etiqueta-info">Teléfono:</span>
                    <span class="valor-info">300 000 0000</span>
                </div>
            </div>

            <div class="estadisticas-perfil">
                <div class="tarjeta-estadistica">
                    <span class="numero-estadistica">5</span>
                    <span class="etiqueta-estadistica">Bares</span>
                </div>
                <div class="tarjeta-estadistica">
                    <span class="numero-estadistica">12</span>
                    <span class="etiqueta-estadistica">Trabajadores</span>
                </div>
            </div>

            <a href="Menu_sistema.html" class="btn-regresar">
                <i class="fa-solid fa-arrow-left"></i> Volver al Menú
            </a>
        </div>
    </main>

    <footer>
    </footer>
</body>

</html>
