<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Administrador</title>
    <link rel="stylesheet" href="/css/perfil_admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <img class="navbar__logo" src="/assets/img/LOGO.png" alt="logo_sistema">
        </nav>
    </header>

    <main>
        <div class="perfil-container">
            <div class="perfil-header">
                <div class="perfil-avatar">
                    <i class="fa-solid fa-user-tie"></i>
                </div>
                <h2>Administrador Principal</h2>
                <span class="perfil-rol">Administrador</span>
            </div>

            <div class="perfil-info">
                <div class="info-item">
                    <span class="info-label">ID Usuario:</span>
                    <span class="info-value">001</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Correo Electrónico:</span>
                    <span class="info-value">admin@sistema.com</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Teléfono:</span>
                    <span class="info-value">300 000 0000</span>
                </div>
            </div>

            <div class="perfil-stats">
                <div class="stat-card">
                    <span class="stat-number">5</span>
                    <span class="stat-label">Bares</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number">12</span>
                    <span class="stat-label">Trabajadores</span>
                </div>
            </div>

            <a href="Menu_sistema.html" class="btn-regresar">
                <i class="fa-solid fa-arrow-left"></i> Volver al Menú
            </a>
        </div>
    </main>

    <footer>
    </footer>
</body>

</html>
