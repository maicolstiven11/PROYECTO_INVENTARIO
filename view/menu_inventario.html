<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu principal de inventario</title>
    <link rel="stylesheet" href="/css/menu_inventario.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>
    <header>
        <nav class="navbar">
            <img class="navbar__logo" src="/assets/img/LOGO.png" alt="logo_sistema">
        </nav>
    </header>
    <main>
        <aside class="aside">
            <h2 class="aside__title">Contabilidad-Sistematica</h2>

            <!-- Perfil de usuario - ahora es un enlace a la vista de admin -->
            <a href="/view/panel_administrador.html" class="user-profile user-profile--link">
                <i class="fa-solid fa-circle-user user-profile__icon"></i>
                <div class="user-profile__info">
                    <p class="user-profile__name">Administrador</p>
                    <span class="user-profile__role badge-admin">Admin</span>
                </div>
                <i class="fa-solid fa-chevron-right user-profile__arrow"></i>
            </a>

            <nav class="aside__nav">

                <a href="/view/visualizar_ventas.html" class="aside__link">
                    <i class="fa-solid fa-bottle-water aside__icon"></i>
                    Visualizar ventas
                </a>

                <a href="/view/visualizar_gastos.html" class="aside__link">
                    <i class="fa-solid fa-sack-dollar aside__icon"></i>
                    Visualizar gastos
                </a>

                <a href="/view/visualizar_pedidos.html" class="aside__link">
                    <i class="fa-solid fa-truck aside__icon"></i>
                    Visualizar pedidos
                </a>

                <a href="/view/editar_productos.html" class="aside__link">
                    <i class="fa-solid fa-pen-to-square aside__icon"></i>
                    Editar productos
                </a>

                <a href="/view/lista_proveedores.html" class="aside__link">
                    <i class="fa-solid fa-truck-field aside__icon"></i>
                    Editar proveedores
                </a>

                <a href="/view/visualizar_informes.html" class="aside__link">
                    <i class="fa-solid fa-file-invoice aside__icon"></i>
                    Visualizar informes
                </a>

                <div class="aside__divider"></div>

                <a href="/view/Menu_sistema.html" class="aside__link btn-salir">
                    <i class="fa-solid fa-arrow-right-from-bracket aside__icon"></i>
                    Salir al Menú Sistema
                </a>

            </nav>
        </aside>

        <section class="content">

            <div class="content__inicio">
                <h1 class="content__title">Inventario de</h1>
                <h2 class="content__subtitle">el bar: fuente de soda la jenny</h2>

                <hr class="content__divider">
            </div>

            <div class="cards">

                <a href="/view/agregar_gasto.html" class="card">
                    <p class="card__title">Agregar gasto</p>
                    <i class="fa-solid fa-plus card__icon"></i>
                </a>

                <a href="/view/agregar_pedido.html" class="card">
                    <p class="card__title">Agregar pedido de proveedor</p>
                    <i class="fa-solid fa-plus card__icon"></i>
                </a>

                <a href="/view/agregar_venta.html" class="card">
                    <p class="card__title">Agregar venta</p>
                    <i class="fa-solid fa-plus card__icon"></i>
                </a>

            </div>

        </section>

    </main>
    <footer>

    </footer>
</body>

</html>
