<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Gastos</title>
    <link rel="stylesheet" href="../css/visualizar_gastos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <img class="navbar__logo" src="../assets/img/LOGO.png" alt="logo_sistema">
        </nav>
    </header>
    <main>
        <h2>GASTOS REGISTRADOS</h2>

        <div class="table-container">
            <table class="data-table">
                <thead class="data-table__head">
                    <tr class="data-table__row data-table__row--head">
                        <th class="data-table__cell data-table__cell--head">ID Gasto</th>
                        <th class="data-table__cell data-table__cell--head">Descripción</th>
                        <th class="data-table__cell data-table__cell--head">Cantidad</th>
                        <th class="data-table__cell data-table__cell--head">Fecha</th>
                        <th class="data-table__cell data-table__cell--head">Subtotal</th>
                    </tr>
                </thead>
                <tbody class="data-table__body">
                    <!-- Datos de ejemplo -->
                    <tr class="data-table__row">
                        <td class="data-table__cell" data-label="ID Gasto">001</td>
                        <td class="data-table__cell" data-label="Descripción">Compra de servilletas</td>
                        <td class="data-table__cell" data-label="Cantidad">50</td>
                        <td class="data-table__cell" data-label="Fecha">2023-10-25</td>
                        <td class="data-table__cell" data-label="Subtotal">$15,000</td>
                    </tr>
                    <tr class="data-table__row">
                        <td class="data-table__cell" data-label="ID Gasto">002</td>
                        <td class="data-table__cell" data-label="Descripción">Pago de luz</td>
                        <td class="data-table__cell" data-label="Cantidad">1</td>
                        <td class="data-table__cell" data-label="Fecha">2023-10-25</td>
                        <td class="data-table__cell" data-label="Subtotal">$120,000</td>
                    </tr>
                    <tr class="data-table__row">
                        <td class="data-table__cell" data-label="ID Gasto">003</td>
                        <td class="data-table__cell" data-label="Descripción">Compra de vasos desechables</td>
                        <td class="data-table__cell" data-label="Cantidad">100</td>
                        <td class="data-table__cell" data-label="Fecha">2023-10-26</td>
                        <td class="data-table__cell" data-label="Subtotal">$25,000</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="menu_inventario.html" class="btn-regresar">
            <i class="fa-solid fa-arrow-left"></i> Regresar
        </a>
    </main>
    <footer>
    </footer>
</body>

</html>
