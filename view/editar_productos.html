<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Productos</title>
    <link rel="stylesheet" href="/css/editar_productos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <img class="navbar__logo" src="/assets/img/LOGO.png" alt="logo_sistema">
        </nav>
    </header>
    <main>
        <h2>GESTIÓN DE PRODUCTOS</h2>

        <div class="tabla-contenedor">
            <table class="tabla-productos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Marca</th>
                        <th>Tipo</th>
                        <th>Cantidad</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Datos de ejemplo -->
                    <tr>
                        <td>001</td>
                        <td>Cerveza Poker</td>
                        <td>$4,000</td>
                        <td>Bavaria</td>
                        <td>Bebidas</td>
                        <td>50</td>
                        <td>
                            <a href="#" class="btn-accion btn-editar">
                                <i class="fa-solid fa-pen-to-square"></i> Editar
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <td>002</td>
                        <td>Papas Margarita</td>
                        <td>$3,000</td>
                        <td>Margarita</td>
                        <td>Snacks</td>
                        <td>20</td>
                        <td>
                            <a href="#" class="btn-accion btn-editar">
                                <i class="fa-solid fa-pen-to-square"></i> Editar
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <td>003</td>
                        <td>Coca Cola</td>
                        <td>$3,500</td>
                        <td>Coca Cola</td>
                        <td>Bebidas</td>
                        <td>30</td>
                        <td>
                            <a href="#" class="btn-accion btn-editar">
                                <i class="fa-solid fa-pen-to-square"></i> Editar
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="/view/menu_inventario.html" class="btn-regresar">
            <i class="fa-solid fa-arrow-left"></i> Regresar
        </a>
    </main>
    <footer>
    </footer>
</body>

</html>
